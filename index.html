<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A/L MCQ — Premium Learning Workspace</title>
<meta name="description" content="Premium A/L Physics and Chemistry MCQ practice platform">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="loading" class="loading"><div class="loader"></div><span>Loading A/L MCQ…</span></div>
<div id="setup-screen" class="setup-screen hidden"><div class="setup-card"><div class="logo setup-logo">A</div><h1>Connect your A/L MCQ website</h1><p>Enter your Supabase Project URL and Publishable/Anon key. These values are stored only in this browser.</p><label>Supabase Project URL<input id="setup-url" placeholder="https://your-project.supabase.co"></label><label>Publishable / Anon key<input id="setup-key" placeholder="eyJhbGciOi..."></label><button id="setup-save" class="btn purple">Connect & Open Website →</button><div id="setup-error" class="setup-error"></div></div></div>

<div class="app-shell">
<aside class="sidebar">
  <div class="logo">A</div>
  <nav>
    <button class="side-btn active" data-page="dashboard" title="Dashboard">⌂</button>
    <button class="side-btn" data-page="papers" title="Papers">▱</button>
    <button class="side-btn" data-page="analytics" title="Analytics">◒</button>
    <button class="side-btn" data-page="leaderboard" title="Leaderboard">♕</button>
    <button class="side-btn" data-page="profile" title="Profile">◎</button>
    <button class="side-btn admin-only hidden" data-page="admin" title="Admin">⚙</button>
  </nav>
  <div class="side-bottom"><button class="side-help">?</button><div id="mini-avatar" class="avatar">A</div></div>
</aside>

<main class="main">
<header class="topbar">
  <div class="brand-mini">A/L <span>MCQ</span></div>
  <div class="top-links">
    <button data-page="dashboard">Dashboard</button>
    <button data-page="papers">Papers</button>
    <button data-page="analytics">Progress</button>
    <button data-page="leaderboard">Leaderboard</button>
  </div>
  <input id="global-search" class="search" placeholder="⌕  Search papers…">
  <button id="auth-btn" class="top-btn">Login</button>
  <button id="signup-btn" class="top-btn primary">Sign up</button>
  <button id="logout-btn" class="top-btn hidden">Logout</button>
</header>

<div id="app"></div>
</main>
</div>

<div id="modal" class="modal"><div class="modal-card"><button class="modal-close" id="modal-close">×</button><div id="modal-content"></div></div></div>
<div id="toast" class="toast"></div>

<script>
window.addEventListener('error', function(e){
  const l=document.getElementById('loading'); if(l) l.style.display='none';
  const s=document.getElementById('setup-screen'); if(s && e.error){
    const err=document.getElementById('setup-error'); if(err) err.textContent='Website error: '+(e.error.message||e.message);
  }
});
window.addEventListener('unhandledrejection', function(e){
  const l=document.getElementById('loading'); if(l) l.style.display='none';
  const err=document.getElementById('setup-error'); if(err) err.textContent='Website error: '+(e.reason?.message||e.reason||'Unknown error');
});
</script><script src="app.js"></script>
</body>
</html>
